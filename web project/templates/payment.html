<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="navbar">
  <a href="{{ url_for('home') }}">Home</a>
  <a href="{{ url_for('menu') }}">Menu</a>
  <a href="{{ url_for('order') }}">Order</a>
  <a href="{{ url_for('payment') }}">Payment</a>
  {% if session.get('role') == 'admin' %}
  <a href="{{ url_for('admin') }}">Admin</a>
  {% endif %}
  <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
</div>

<h2 class="title">Checkout <i class="fa-solid fa-credit-card"></i></h2>

<!-- Form 1: User Info -->
<form class="form-box" onsubmit="return false;">
  <h3>User Information</h3>
  <input type="text" id="fullName" placeholder="Full Name" required>
  <input type="text" id="address" placeholder="Address" required>
  <input type="tel" id="phone" placeholder="Phone Number" required>
</form>

<!-- Form 2: Payment -->
<form class="form-box" onsubmit="return false;">
  <h3>Payment Method</h3>

  <div class="payment-options">
    <label class="payment-option">
      <input type="radio" name="payment" value="cash" onclick="toggleVisa(false)">
      <i class="pay-icon fa-solid fa-money-bill-wave"></i>
      <span>Cash</span>
    </label>

    <label class="payment-option">
      <input type="radio" name="payment" value="visa" onclick="toggleVisa(true)">
      <i class="pay-icon fa-brands fa-cc-visa"></i>
      <span>Visa</span>
    </label>
  </div>

  <div id="visaFields">
    <input type="text" placeholder="Card Number (16 digits)" maxlength="19">
    <input type="text" placeholder="Expiry Date (MM/YY)" maxlength="5">
    <input type="text" placeholder="CVV" maxlength="3">
  </div>

  <button type="button" onclick="confirmOrder()">Confirm Order</button>
</form>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
