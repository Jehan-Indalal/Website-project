<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="navbar">
  <a href="{{ url_for('home') }}">Home</a>
  <a href="{{ url_for('menu') }}">Menu</a>
  <a href="{{ url_for('order') }}">Order</a>
  <a href="{{ url_for('payment') }}">Payment</a>
  {% if session.get('role') == 'admin' %}
  <a href="{{ url_for('admin') }}">Admin</a>
  {% endif %}
  <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
</div>

<h2 class="title">Your Order <i class="fa-solid fa-bag-shopping"></i></h2>

<div class="order-box">
  <div id="orderList"></div>

  <div class="order-total">
    <i class="fa-solid fa-receipt"></i>
    Total: <span id="total">0</span> EGP
  </div>

  <a href="{{ url_for('payment') }}" class="btn order-btn">
    <i class="fa-solid fa-credit-card"></i> Go to Payment
  </a>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
